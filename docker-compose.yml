services:
  backend:
    build: .
    container_name: go-server
    ports:
      - "1080:1080" # SOCKS5
      - "8081:8081" # HTTP
      - "8080:8080" # stats, metrics
      - "8443:8443/udp" # quic
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      - REDIS_ADDR=redis:6379

  redis:
    image: redis:7
    container_name: redis-server
    volumes:
      - .logs/redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./metrics/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./metrics/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=proxy199
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-worldmap-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./metrics/grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/listen_host.xml:/etc/clickhouse-server/config.d/listen_host.xml:ro
    environment:
      CLICKHOUSE_DB: node_analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "127.0.0.1:8123/ping" ]
      interval: 2s
      retries: 10

  migrate:
    image: migrate/migrate  # or your own small image
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./clickhouse/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=clickhouse://clickhouse:9000/analytics"
      - "up"
    restart: "no"

volumes:
  prometheus_data:
  grafana_data:
  clickhouse-data:
